services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    environment:
      # Ollama chạy trên máy host (không chạy trong container).
      - OLLAMA_HOST=http://host.docker.internal:11434
      - VLM_MODEL=qwen2.5vl:3b
      # Đổi mật khẩu quản trị ban đầu tại đây hoặc sau khi đăng nhập lần đầu.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Vite chuyển /api, /evidence sang container API (cookie đăng nhập cùng nguồn).
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      - api
